name: Codex AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/*.yml"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"

jobs:
  codex-review:
    name: Codex AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_TITLE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.title')
          PR_AUTHOR=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.user.login')
          PR_BASE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.base.ref')
          PR_HEAD=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.head.ref')

          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "author<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "base<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_BASE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "head<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_HEAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          gh pr diff $PR_NUMBER > pr_changes.diff
          echo "diff_size=$(wc -l < pr_changes.diff)" >> $GITHUB_OUTPUT

      - name: Codex Code Review
        id: review
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$API_BASE_URL" ]; then
            echo "::warning::OPENAI_API_KEY or API_BASE_URL not set. Skipping."
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_INFO="PR #$PR_NUMBER - ${{ steps.pr_info.outputs.title }}"
          AUTHOR="${{ steps.pr_info.outputs.author }}"
          BASE="${{ steps.pr_info.outputs.base }}"
          DIFF_SIZE="${{ steps.diff.outputs.diff_size }}"

          DIFF_CONTENT=$(head -c 80000 pr_changes.diff 2>/dev/null || echo "[no diff]")

          USER_CONTENT="Review the following PR changes.

PR: $PR_INFO
Author: $AUTHOR
Base branch: $BASE
Diff size: $DIFF_SIZE lines

## Review Focus
1. Security: hardcoded secrets, API key leaks, injection risks
2. MCP protocol compliance: quota limits, error handling
3. Error handling: async try/catch, proper HTTP status codes
4. Test coverage: new code has corresponding tests
5. Code quality: ESM imports, naming, error context

## Output Format
## Summary
[One paragraph overview]

## Critical Issues (must fix)
- [file:line] - issue description

## Suggestions (recommended)
- [file:line] - suggestion description

## Positive Highlights
- What was done well

\`\`\`diff
$DIFF_CONTENT
\`\`\`"

          PAYLOAD=$(jq -n \
            --arg model "gpt-4o-mini" \
            --argjson max_tokens 2048 \
            --argjson temperature 0.3 \
            --arg system "You are an expert code reviewer for the Axiqra project. Axiqra is a knowledge engineering and memory system with MCP adapters, search service, audit/tracing, policy-based access control, and JSON store persistence. Review guidelines: 1) SECURITY FIRST: hardcoded secrets, API key leaks, injection risks. 2) MCP compliance: quota limits, error handling, protocol adherence. 3) Error handling: async try/catch, proper HTTP status codes. 4) Test coverage: new code has corresponding tests. 5) Code quality: ESM imports, naming conventions, error context. Output format (Markdown): ## Summary [brief overview] ## Critical Issues (block merge) - [file:line] - issue ## Suggestions (recommended) - [file:line] - suggestion ## Positive Highlights - what was done well. Be concise and actionable." \
            --arg user "$USER_CONTENT" \
            '{
              model: $model,
              max_tokens: $max_tokens,
              temperature: $temperature,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }')

          RESPONSE=$(curl -s -X POST "$API_BASE_URL/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD")

          REVIEW=$(echo $RESPONSE | jq -r '.choices[0].message.content // empty')

          if [ -n "$REVIEW" ]; then
            echo "review_body<<EOF" >> $GITHUB_OUTPUT
            echo "$REVIEW" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            ERROR_MSG=$(echo $RESPONSE | jq -r '.error.message // "unknown error"')
            echo "::warning::API call failed: $ERROR_MSG"
            exit 0
          fi

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = process.env.REVIEW_BODY;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## Codex AI Code Review\n\n${reviewBody}\n\n---\n*Reviewed by Codex AI (gpt-4o-mini)*`
              });
            }
