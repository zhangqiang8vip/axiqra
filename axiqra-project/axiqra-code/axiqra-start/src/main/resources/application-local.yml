spring:
  application:
    name: axiqra-core
  main:
    banner-mode: off
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  datasource:
    druid:
      enabled: true
      driver-class-name: org.h2.Driver
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      username: sa
      password: 
      initial-size: 1
      min-idle: 1
      max-active: 5
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 5s
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

management:
  server:
    port: 9090
  health:
    db:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: true
  is-log: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  is-read-body: false

security:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    cache-enabled: false
  global-config:
    print-banner: false

axiqra:
  audit-datasource:
    enabled: false
  feature:
    enable-api-signature: false
    enable-rate-limit: false
    enable-minio: false

axiqra-flyway:
  enabled: true

logging:
  level:
    com.axiqra: DEBUG
