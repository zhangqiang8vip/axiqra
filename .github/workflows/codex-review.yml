name: Codex AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/*.yml"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to review"
        required: false
        type: string

env:
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  REVIEW_MODEL: gpt-4o-mini

jobs:
  codex-review:
    name: Codex AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info & diff
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          PR_TITLE=$(gh api repos/{owner}/{repo}/pulls/$PR_NUMBER --jq '.title')
          PR_AUTHOR=$(gh api repos/{owner}/{repo}/pulls/$PR_NUMBER --jq '.user.login')
          PR_BASE=$(gh api repos/{owner}/{repo}/pulls/$PR_NUMBER --jq '.base.ref')
          PR_HEAD=$(gh api repos/{owner}/{repo}/pulls/$PR_NUMBER --jq '.head.ref')

          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "author=$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "base=$PR_BASE" >> $GITHUB_OUTPUT
          echo "head=$PR_HEAD" >> $GITHUB_OUTPUT

          gh pr diff $PR_NUMBER > pr_changes.diff
          DIFF_SIZE=$(wc -c < pr_changes.diff)
          echo "diff_size=$DIFF_SIZE" >> $GITHUB_OUTPUT

      - name: Call AI Review API
        id: review
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PR_BASE: ${{ steps.pr.outputs.base }}
          PR_HEAD: ${{ steps.pr.outputs.head }}
          DIFF_SIZE: ${{ steps.pr.outputs.diff_size }}
        run: |
          MAX_CHARS=40000
          DIFF_CONTENT=$(cat pr_changes.diff)

          if [ "${#DIFF_CONTENT}" -gt $MAX_CHARS ]; then
            DIFF_CONTENT="${DIFF_CONTENT:0:$MAX_CHARS}"
            TRUNCATED=true
          else
            TRUNCATED=false
          fi

          USER_CONTENT="Please review PR #${PR_NUMBER}:
Title: ${PR_TITLE}
Author: ${PR_AUTHOR}
Base: ${PR_BASE} -> Head: ${PR_HEAD}
Diff (${DIFF_SIZE} bytes):
${DIFF_CONTENT}
${TRUNCATED:+[Output truncated, showing first $MAX_CHARS chars]}"

          SYSTEM_CONTENT="You are an expert code reviewer for the Axiqra project. Axiqra is a knowledge engineering and memory system with MCP adapters, search service, audit/tracing, policy-based access control, and JSON store persistence. Review guidelines: 1) SECURITY FIRST: hardcoded secrets, API key leaks, injection risks. 2) MCP compliance: quota limits, error handling, protocol adherence. 3) Error handling: async try/catch, proper HTTP status codes. 4) Test coverage: new code has corresponding tests. 5) Code quality: ESM imports, naming conventions, error context. Output format (Markdown): ## Summary [brief overview] ## Critical Issues (block merge) - [file:line] - issue ## Suggestions (recommended) - [file:line] - suggestion ## Positive Highlights - what was done well. Be concise and actionable, max 1500 tokens output."

          PAYLOAD=$(jq -n \
            --arg model "$REVIEW_MODEL" \
            --argjson temperature 0.3 \
            --argjson max_tokens 2000 \
            --arg system "$SYSTEM_CONTENT" \
            --arg user "$USER_CONTENT" \
            '{
              model: $model,
              temperature: $temperature,
              max_tokens: $max_tokens,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }')

          REVIEW=$(curl -s -X POST "$API_BASE_URL/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD")

          if echo "$REVIEW" | grep -q '"choices"'; then
            REVIEW_BODY=$(echo "$REVIEW" | jq -r '.choices[0].message.content // empty')
            if [ -n "$REVIEW_BODY" ]; then
              echo "review_body=$REVIEW_BODY" >> $GITHUB_OUTPUT
              echo "$REVIEW_BODY"
            else
              echo "::warning::No review content returned"
              echo "raw_response=$REVIEW" >> $GITHUB_OUTPUT
            fi
          else
            echo "::warning::API call failed: $REVIEW"
          fi

      - name: Post review comment
        if: ${{ steps.review.outputs.review_body != '' }}
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = process.env.REVIEW_BODY;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber && reviewBody) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## Codex AI Code Review\n\n${reviewBody}\n\n---\n*Reviewed by Codex AI*\n`
              });
            }
