# CodeRabbit AI Code Review Configuration
# Axiqra Project - https://github.com/zhangqiang8vipp/axiqra
# Docs: https://docs.coderabbit.ai/

language: zh-CN
ui_input: 简体中文

# =============================================================================
# 审查模式：自信型 — 提供详细反馈，主动要求修改
# =============================================================================
reviews:
  profile: assertive  # 改为自信型：更详细审查，吹毛求疵是优点

  high_level_summary:
    auto_title: true
    placeholder: "Axiqra S1 Core 代码审查"
    collapseWalkthrough: false  # 显示完整审查过程
    sequence_summary: true
    sequence_desc: true
    debug: false

  poem: true          # 用诗结尾（可保留，CodeRabbit 特色）
  review_status: true  # 显示审查状态

  # 必须所有评论解决后才能批准
  request_changes_workflow: true

  # PR/MR 描述自动生成摘要
  auto_title: true
  auto_title_type: "summarize"  # 自动生成摘要

  auto_review:
    enabled: true
    auto_title_placeholder: "[Axiqra] 代码审查"
    update_branch: false
    detect_all_applicable_languages: true
    patterns:
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.html"
      - "**/*.md"
      - "**/Dockerfile*"
    exclude:
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/.git/**"
      - "**/coverage/**"
      - "**/*.min.js"
      - "**/fixtures/v2.0/**"        # fixture 数据不需要审查
      - "**/docs/evidence/**"          # 文档证据不需要审查
      - "**/docs/PDF/**"               # PDF 不审查
      - "**/宣传/**"                    # 宣传页不需要审查

# =============================================================================
# 自定义审核指南：按文件路径分区块
# =============================================================================
review_rules:
  # 全局规则
  - path: "**/*"
    points:
      - name: "安全审查"
        description: |
          检查是否有硬编码密钥、API token、密码等敏感信息。
          检查是否有注入风险（SQL、命令、路径注入）。
          检查数据脱敏（redaction）逻辑是否正确。
      - name: "错误处理"
        description: |
          所有 async 操作必须有 try/catch。
          错误必须映射到 ERROR_CATALOG 中的标准错误码。
          HTTP 状态码必须与错误类型匹配（401/403/404/422/429/500）。
      - name: "测试覆盖"
        description: |
          新功能必须有对应测试。
          边界条件（配额边界、空值、第一个/最后一个）必须覆盖。
          测试命名必须以动词开头，描述期望行为。

  # MCP 协议文件
  - path: "src/s1-core/mcp-*.mjs"
    points:
      - name: "MCP 协议合规"
        description: |
          MCP 响应必须符合 s1.mcp.v1 schema_version。
          quota 限制必须在每次调用时正确递减。
          超出配额时必须返回 429 + QUOTA_LIMITED + no_recall_performed=true。
          必须记录 mcp.search.quota_checked 审计事件。

  # Trace 相关文件
  - path: "src/s1-core/trace-*.mjs"
    points:
      - name: "Trace Schema 校验"
        description: |
          所有必填字段（schema_version, task_goal, context, paths, evidence,
          authorization, writeback_meta）必须有校验。
          缺失必填字段必须抛出 TRACE_SCHEMA_INVALID (422)。
      - name: "幂等性"
        description: |
          重复提交必须通过 idempotency_key 识别并返回 idempotent_replay=true。
          幂等重放不能重复保存数据。

  # Policy 文件
  - path: "src/s1-core/policy.mjs"
    points:
      - name: "鉴权策略"
        description: |
          匿名用户（authenticated=false）不能调用 MCP（返回 401）。
          缺少必要 scope 必须返回 403 SCOPE_DENIED。
          私有内容（visibility=enterprise/own）必须对无权限用户隐藏。

  # 存储文件
  - path: "src/s1-core/*store*.mjs"
    points:
      - name: "数据隔离"
        description: |
          用户间数据必须严格隔离，不能相互泄露。
          配额计数器必须按 subjectKey + 日期分桶。

  # API 适配器
  - path: "src/s1-core/api-adapter.mjs"
    points:
      - name: "API 封套格式"
        description: |
          所有响应必须包含 schema_version: s1.api.v1。
          所有响应必须包含 request_id。
          成功响应 http_status: 200 或 201。

  # 脱敏文件
  - path: "src/s1-core/redaction.mjs"
    points:
      - name: "脱敏模式"
        description: |
          必须覆盖: api_key=xxx, apiKey:xxx, token=xxx, password:xxx
          脱敏必须递归处理嵌套对象和数组。
          脱敏是正向覆盖，不能泄露原始值。

# =============================================================================
# Chat 设置
# =============================================================================
chat:
  auto_reply: true

# =============================================================================
# 自定义提示（对 AI 审查者的额外指导）
# =============================================================================
hints:
  hint1: "检查代码是否有明显的安全漏洞，如硬编码密钥、API token、SQL 注入、路径注入"
  hint2: "MCP 相关文件必须检查 quota 限制是否正确递减和重置"
  hint3: "Trace 相关文件必须检查 schema 校验和幂等性逻辑"
  hint4: "Policy 文件必须检查权限边界：匿名/认证、不同 scope 角色的访问控制"
  hint5: "评估测试覆盖率：边界条件、空值、第一个/最后一个必须覆盖"
  hint6: "审查文档是否与代码变更同步更新（docs/ 目录变更时检查）"
  hint7: "检查 ESM 模块导入是否一致（.mjs 扩展名）"