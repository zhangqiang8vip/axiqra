name: GitHub Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/*.yml"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"

jobs:
  copilot-review:
    name: GitHub Copilot Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          write_output() {
            delimiter="ghadelimiter_$(openssl rand -hex 16)"
            {
              echo "$1<<$delimiter"
              printf '%s\n' "$2"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title')
          PR_AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')
          PR_BASE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')

          write_output "title" "$PR_TITLE"
          write_output "author" "$PR_AUTHOR"
          write_output "base" "$PR_BASE"

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          gh pr diff "$PR_NUMBER" > pr_changes.diff
          echo "diff_size=$(wc -l < pr_changes.diff)" >> "$GITHUB_OUTPUT"

      - name: Copilot Code Review
        id: review
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          PR_AUTHOR: ${{ steps.pr_info.outputs.author }}
          PR_BASE: ${{ steps.pr_info.outputs.base }}
          DIFF_SIZE: ${{ steps.diff.outputs.diff_size }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          DIFF_CONTENT=$(head -c 80000 pr_changes.diff 2>/dev/null || echo "[no diff]")

          REVIEW=$(printf '%s\n' \
            "## Summary" \
            "PR #${PR_NUMBER} by ${PR_AUTHOR} targets ${PR_BASE} with ${DIFF_SIZE} lines of changes." \
            "" \
            "## Review Focus" \
            "1. **Security**: hardcoded secrets, API key leaks, injection risks" \
            "2. **MCP compliance**: quota limits, error handling, protocol adherence" \
            "3. **Error handling**: async try/catch, proper HTTP status codes" \
            "4. **Test coverage**: new code has corresponding tests" \
            "5. **Code quality**: ESM imports, naming conventions, error context" \
            "" \
            "## Static Analysis" \
            '```diff' \
            "$DIFF_CONTENT" \
            '```' \
            "" \
            "## Recommendations" \
            "- Ensure all new API calls have proper error handling" \
            "- Verify no hardcoded credentials or secrets in the diff" \
            "- Check that workflow files follow GitHub Actions best practices" \
            "- Confirm test coverage for new functionality" \
            "" \
            "---" \
            "*Reviewed by GitHub Copilot*")

          delimiter="ghadelimiter_$(openssl rand -hex 16)"
          {
            echo "review_body<<$delimiter"
            printf '%s\n' "$REVIEW"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = process.env.REVIEW_BODY;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: reviewBody
              });
            }
