name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "axiqra-project/axiqra-code/**"
      - "axiqra-project/.github/scripts/**"
      - ".github/scripts/**"
      - "axiqra-project/axiqra-infra/**"
      - "axiqra-project/axiqra-website/**"
      - "tests/**"
      - ".github/workflows/*.yml"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to review"
        required: false
        type: string

jobs:
  gemini-review:
    name: Gemini AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            pr_data=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '{title: .title, body: .body, base: .base.ref, head: .head.ref, author: .user.login}')
            echo "title=$(echo $pr_data | jq -r '.title')" >> $GITHUB_OUTPUT
            echo "base=$(echo $pr_data | jq -r '.base')" >> $GITHUB_OUTPUT
            echo "author=$(echo $pr_data | jq -r '.author')" >> $GITHUB_OUTPUT
          fi

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr diff $PR_NUMBER > pr_changes.diff
            echo "diff_size=$(wc -l < pr_changes.diff)" >> $GITHUB_OUTPUT
          fi

      - name: Gemini Code Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret not set. Skipping Gemini review."
            exit 0
          fi

          # 构建审查上下文
          PR_INFO="PR #$PR_NUMBER - ${{ steps.pr_info.outputs.title }}"
          AUTHOR="${{ steps.pr_info.outputs.author }}"
          BASE="${{ steps.pr_info.outputs.base }}"
          DIFF_SIZE="${{ steps.diff.outputs.diff_size }}"

          # 构建 prompt 文本（使用 jq --arg 安全转义）
          PROMPT=$(jq -n \
            --arg pr_info "$PR_INFO" \
            --arg author "$AUTHOR" \
            --arg base "$BASE" \
            --arg diff_size "$DIFF_SIZE" \
            'You are an expert code reviewer for the Axiqra project (a knowledge engineering and memory system). Review the following PR changes.\n\nPR: \($pr_info)\nAuthor: \($author)\nBase branch: \($base)\n\nReview focus areas:\n1. Security: hardcoded secrets, API key leaks, injection risks\n2. MCP protocol compliance: quota limits, error handling\n3. Error handling: async try/catch, proper HTTP status codes\n4. Test coverage: new code has corresponding tests\n5. Code quality: ESM imports, naming, error context\n\nProvide your review in this format:\n## Summary\n[One paragraph overview]\n\n## Critical Issues (must fix)\n- [file:line] - issue description\n\n## Suggestions (recommended)\n- [file:line] - suggestion description\n\n## Positive Highlights\n- What was done well\n\nDiff size: \($diff_size) lines\nOutput format: Markdown')

          # 构建 JSON payload（使用 jq --arg 安全注入 prompt）
          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            '{contents: [{parts: [{text: $prompt}]}]}')

          # 调用 Gemini API 进行代码审查
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          REVIEW=$(echo $RESPONSE | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -n "$REVIEW" ]; then
            echo "review_body<<EOF" >> $GITHUB_OUTPUT
            echo "$REVIEW" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = `${{ steps.review.outputs.review_body }}`;
            const prNumber = context.payload.pull_request?.number || context.inputs.pr_number;

            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## Gemini AI Code Review 🤖\n\n${reviewBody}\n\n---\n*Reviewed by Gemini AI*`
              });
            }
