name: OpenRouter AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "docs/**"
      - "axiqra-project/**"
      - "tests/**"
      - ".github/workflows/openrouter-review.yml"
      - ".github/workflows/gemini-review.yml"
      - ".github/workflows/axiqra-quality-gates-sample.yml"
      - ".github/scripts/**"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to review"
        required: false
        type: string

jobs:
  openrouter-review:
    name: OpenRouter AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            pr_data=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '{title: .title, body: .body, base: .base.ref, head: .head.ref, author: .user.login}')
            echo "title<<EOF" >> $GITHUB_OUTPUT
            echo "$pr_data" | jq -r '.title' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "base<<EOF" >> $GITHUB_OUTPUT
            echo "$pr_data" | jq -r '.base' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "author<<EOF" >> $GITHUB_OUTPUT
            echo "$pr_data" | jq -r '.author' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr diff $PR_NUMBER > pr_changes.diff
            echo "diff_size=$(wc -l < pr_changes.diff)" >> $GITHUB_OUTPUT
          fi

      - name: OpenRouter Code Review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY secret not set. Skipping OpenRouter review."
            exit 0
          fi

          PR_INFO="PR #$PR_NUMBER - ${{ steps.pr_info.outputs.title }}"
          AUTHOR="${{ steps.pr_info.outputs.author }}"
          BASE="${{ steps.pr_info.outputs.base }}"
          DIFF_SIZE="${{ steps.diff.outputs.diff_size }}"

          # Read diff content, validated as UTF-8, truncated to 120000 chars
          DIFF_CONTENT=$(head -c 120000 pr_changes.diff | iconv -f utf-8 -t utf-8 -c 2>/dev/null | cut -c1-120000)
          if [ -z "$DIFF_CONTENT" ]; then
            DIFF_CONTENT=$(head -c 120000 pr_changes.diff)
          fi

          USER_CONTENT="Review the following PR changes.

PR: $PR_INFO
Author: $AUTHOR
Base branch: $BASE
Diff size: $DIFF_SIZE lines

## Review Focus
1. Security: hardcoded secrets, API key leaks, injection risks
2. MCP protocol compliance: quota limits, error handling
3. Error handling: async try/catch, proper HTTP status codes
4. Test coverage: new code has corresponding tests
5. Code quality: ESM imports, naming, error context
6. Workflow changes: trigger paths, permissions, secrets usage

## Output Format
## Summary
[One paragraph overview]

## Critical Issues (must fix)
- [file:line] - issue description

## Suggestions (recommended)
- [file:line] - suggestion description

## Positive Highlights
- What was done well

---
\`\`\`diff
$DIFF_CONTENT
\`\`\`"

          PAYLOAD=$(jq -n \
            --arg model "openrouter/free" \
            --argjson max_tokens 2048 \
            --arg system "You are an expert code reviewer for the Axiqra project (a knowledge engineering and memory system). Provide concise, actionable feedback." \
            --arg user "$USER_CONTENT" \
            '{
              model: $model,
              max_tokens: $max_tokens,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }')

          RESPONSE=$(curl -s -X POST \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/zhangqiang8vipp/axiqra" \
            -H "X-Title: Axiqra Code Review" \
            -d "$PAYLOAD")

          REVIEW=$(echo $RESPONSE | jq -r '.choices[0].message.content // empty')

          if [ -n "$REVIEW" ]; then
            echo "review_body<<EOF" >> $GITHUB_OUTPUT
            echo "$REVIEW" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            ERROR_MSG=$(echo $RESPONSE | jq -r '.error.message // "unknown error"')
            echo "::warning::OpenRouter API error: $ERROR_MSG"
          fi

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = process.env.REVIEW_BODY;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## OpenRouter AI Code Review 🤖\n\n${reviewBody}\n\n---\n*Reviewed by OpenRouter (openrouter/free model)*`
              });
            }
