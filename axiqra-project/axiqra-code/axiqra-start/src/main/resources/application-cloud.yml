spring:
  datasource:
    druid:
      enabled: true
      driver-class-name: org.postgresql.Driver
      url: ${COCKROACH_DB_URL}
      username: ${COCKROACH_DB_USER}
      password: ${COCKROACH_DB_PASSWORD}
      initial-size: ${DB_POOL_INITIAL_SIZE:3}
      min-idle: ${DB_POOL_MIN_IDLE:3}
      max-active: ${DB_POOL_MAX_ACTIVE:10}
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      timeout: 5s
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: 5s
  threads:
    virtual:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    db:
      enabled: ${MANAGEMENT_HEALTH_DB_ENABLED:true}
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-log: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  is-read-body: false

security:
  algorithm:
    api-signature: HMAC-SHA256
    field-encryption: AES-256-GCM
    password-hash: BCRYPT
    jwt-signature: HS256
    digest: SHA-256
  api-signature:
    app-id-header: X-Axiqra-App-Id
    timestamp-header: X-Axiqra-Timestamp
    signature-header: X-Axiqra-Signature
    nonce-header: X-Axiqra-Nonce
    clock-skew-seconds: 300
    max-body-size: 1048576
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8080
      - https://www.axiqra.com
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - '*'
    exposed-headers:
      - X-Trace-Id
      - Authorization

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    cache-enabled: false
    jdbc-type-for-null: 'NULL'
  global-config:
    print-banner: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms

axiqra:
  quota:
    daily-limit: 2000
    ttl-hours: 48
  rate-limit:
    per-minute: 100
    window-seconds: 60
  tenant:
    id: 0
  audit-datasource:
    enabled: ${AUDIT_DB_ENABLED:true}
    url: ${AUDIT_DB_URL}
    username: ${AUDIT_APP_DB_USER}
    password: ${AUDIT_APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:axiqra-evidence}
    secure: ${MINIO_SECURE:false}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:axiqra}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  crypto:
    field-encrypt-key: ${FIELD_ENCRYPT_KEY}
  feature:
    enable-api-signature: ${AXIQRA_ENABLE_API_SIGNATURE:false}
    enable-rate-limit: ${AXIQRA_ENABLE_RATE_LIMIT:true}
    enable-minio: ${AXIQRA_ENABLE_MINIO:false}
  health:
    probes:
      postgres-host: ${AXIQRA_HEALTH_POSTGRES_HOST:}
      postgres-port: ${AXIQRA_HEALTH_POSTGRES_PORT:5432}
      minio-health-url: ${AXIQRA_HEALTH_MINIO_URL:http://127.0.0.1:9000/minio/health/live}

logging:
  file:
    path: ${LOGGING_FILE_PATH:./logs/axiqra}
  level:
    com.axiqra: ${AXIQRA_LOG_LEVEL:INFO}
    com.axiqra.core.service.impl: ${AXIQRA_LOG_LEVEL_VECTOR:INFO}
    com.axiqra.core.mapper: ${AXIQRA_LOG_LEVEL_MAPPER:INFO}
    org.springframework.jdbc.core: ${AXIQRA_LOG_LEVEL_JDBC:INFO}

alert:
  webhook:
    enabled: ${ALERT_WEBHOOK_ENABLED:false}
    url: ${ALERT_WEBHOOK_URL:}
    allowed-hosts: ${ALERT_WEBHOOK_ALLOWED_HOSTS:}
    timeout-ms: ${ALERT_WEBHOOK_TIMEOUT_MS:5000}
