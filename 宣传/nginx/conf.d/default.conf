limit_req_zone $binary_remote_addr zone=waitlist:10m rate=3r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name axiqra.com www.axiqra.com _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/waitlist {
        limit_req zone=waitlist burst=5 nodelay;
        proxy_pass http://waitlist-api:8080/api/waitlist;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        proxy_pass http://waitlist-api:8080/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
