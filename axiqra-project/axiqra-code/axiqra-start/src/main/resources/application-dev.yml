spring:
  datasource:
    druid:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:26257/axiqra?sslmode=disable&currentSchema=public
      username: root
      password: ${DB_PASSWORD:}
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      database: 0
  rabbitmq:
    host: localhost
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:axq_rabbit}
    password: ${RABBITMQ_DEFAULT_PASS:change_me_before_production}
    virtual-host: /
    connection-timeout: 5s
  threads:
    virtual:
      enabled: false

axiqra:
  audit-datasource:
    url: jdbc:postgresql://localhost:5432/axq_audit_db
    username: ${AUDIT_DB_USER:axq_audit}
    password: ${AUDIT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: axiqra-evidence
    secure: false
  jwt:
    secret: ${JWT_SECRET:change_me_before_production_use_256bit_key_here}
    issuer: axiqra
    expire-seconds: 7200
  crypto:
    field-encrypt-key: ${FIELD_ENCRYPT_KEY:change_me_before_production_32bytes}
  feature:
    enable-api-signature: true
    enable-rate-limit: true
    enable-minio: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.axiqra: DEBUG
    org.springframework.jdbc: INFO
