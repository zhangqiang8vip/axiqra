spring:
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/postgres?sslmode=disable
    username: postgres
    password: ${DB_PASSWORD:change_me_before_production}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:change_me_before_production}
      timeout: 5s
      database: 0
  rabbitmq:
    host: localhost
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:axq_rabbit}
    password: ${RABBITMQ_DEFAULT_PASS:change_me_before_production}
    virtual-host: /
    connection-timeout: 5s

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    db:
      enabled: false
    redis:
      enabled: true
    rabbit:
      enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-log: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  is-read-body: false

security:
  algorithm:
    api-signature: HMAC-SHA256
    field-encryption: AES-256-GCM
    password-hash: BCRYPT
    jwt-signature: HS256
    digest: SHA-256
  api-signature:
    app-id-header: X-Axiqra-App-Id
    timestamp-header: X-Axiqra-Timestamp
    signature-header: X-Axiqra-Signature
    nonce-header: X-Axiqra-Nonce
    clock-skew-seconds: 300
    max-body-size: 1048576
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8080
      - https://www.axiqra.com
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - '*'
    exposed-headers:
      - X-Trace-Id
      - Authorization

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    cache-enabled: false
    jdbc-type-for-null: 'NULL'
  global-config:
    print-banner: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms

axiqra:
  quota:
    daily-limit: 2000
    ttl-hours: 48
  rate-limit:
    per-minute: 100
    window-seconds: 60
  tenant:
    id: 0
  audit-datasource:
    enabled: false
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:change_me_before_production}
    secret-key: ${MINIO_SECRET_KEY:change_me_before_production}
    bucket: axiqra-evidence
    secure: false
  jwt:
    secret: ${JWT_SECRET:change_me_before_production_use_256bit_key_here}
    issuer: axiqra
    expire-seconds: 7200
  crypto:
    field-encrypt-key: ${FIELD_ENCRYPT_KEY:change_me_before_production_32bytes}
  feature:
    enable-api-signature: true
    enable-rate-limit: true
    enable-minio: false

logging:
  level:
    com.axiqra: DEBUG
    org.springframework.jdbc: INFO

alert:
  webhook:
    enabled: false
    url: ${ALERT_WEBHOOK_URL:}
    allowed-hosts: ${ALERT_WEBHOOK_ALLOWED_HOSTS:}
    timeout-ms: 5000

axiqra-flyway:
  enabled: false
