name: axiqra

services:
  waitlist-api:
    image: python:3.12-alpine
    container_name: axiqra-waitlist
    restart: unless-stopped
    working_dir: /app
    command: python /app/server.py
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WAITLIST_DATA_PATH: "${WAITLIST_DATA_PATH:-/data/waitlist.csv}"
      WAITLIST_PORT: "${WAITLIST_PORT:-8080}"
      WAITLIST_MAX_BODY_BYTES: "${WAITLIST_MAX_BODY_BYTES:-32768}"
      WAITLIST_RATE_LIMIT_WINDOW_SECONDS: "${WAITLIST_RATE_LIMIT_WINDOW_SECONDS:-60}"
      WAITLIST_RATE_LIMIT_MAX_REQUESTS: "${WAITLIST_RATE_LIMIT_MAX_REQUESTS:-8}"
      WAITLIST_RATE_LIMIT_MAX_BUCKETS: "${WAITLIST_RATE_LIMIT_MAX_BUCKETS:-4096}"
    volumes:
      - ./api:/app:ro
      - ./data:/data
    networks:
      - axiqra-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128

  nginx:
    image: nginx:1.27-alpine
    container_name: axiqra-nginx
    restart: unless-stopped
    depends_on:
      - waitlist-api
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - axiqra-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    pids_limit: 128

networks:
  axiqra-internal:
    driver: bridge
