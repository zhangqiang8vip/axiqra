name: axiqra

services:
  waitlist-api:
    image: python:3.12-alpine
    container_name: axiqra-waitlist
    restart: unless-stopped
    working_dir: /app
    command: python /app/server.py
    environment:
      WAITLIST_DATA_PATH: /data/waitlist.csv
      WAITLIST_PORT: "8080"
    volumes:
      - ./api:/app:ro
      - ./data:/data

  nginx:
    image: nginx:1.27-alpine
    container_name: axiqra-nginx
    restart: unless-stopped
    depends_on:
      - waitlist-api
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
