# Axiqra Connect CLI 配置文件

# API 配置
api:
  url: https://api.axiqra.com
  timeout: 30
  retry: 3

# CLI 配置
cli:
  install_path: ~/.axiqra
  log_level: info

# Connect 配置
connect:
  default_channel: cli
  default_tool_type: custom
  auto_doctor: true

# Doctor 检测配置
doctor:
  checks:
    - network       # 网络连接
    - auth          # 认证状态
    - quota         # 配额状态
    - version       # CLI 版本
    - config        # 配置文件
    - storage       # 存储权限
    - proxy         # 代理设置
    - firewall     # 防火墙

# 路径配置
paths:
  config: ~/.axiqra/config/config.yaml
  cache: ~/.axiqra/cache
  data: ~/.axiqra/data
  logs: ~/.axiqra/logs
