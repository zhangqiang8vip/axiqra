# ============================================================
# Axiqra Prometheus 配置
# 抓取 axiqra-core /actuator/prometheus 端点（默认 9090 端口）
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "axiqra-s1-monitor"

scrape_configs:
  # ----------- Axiqra Core (Spring Boot Actuator) -----------
  - job_name: "axiqra-core"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      # host.docker.internal 让容器能访问宿主机的 9090 端口
      - targets:
          - "host.docker.internal:9090"
        labels:
          application: "axiqra-core"
          env: "dev"
          tier: "backend"

  # ----------- Prometheus 自身指标 -----------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9091"
