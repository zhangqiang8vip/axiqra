name: Axiqra Quality Gates

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "axiqra-project/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".gitignore"
      - "**/.gitignore"
      - "*.java"
      - "**/*.java"
      - "*.xml"
      - "**/*.xml"
      - "*.yml"
      - "**/*.yml"
      - "*.yaml"
      - "**/*.yaml"
      - "*.sql"
      - "**/*.sql"
      - "Dockerfile*"
      - "**/Dockerfile*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java-gates:
    name: Java Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Java project changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          else
            changed_files=$(git ls-files)
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^axiqra-project/axiqra-code/'; then
            echo "java_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "java_changed=false" >> "$GITHUB_OUTPUT"
            echo "No Java project changes detected; skipping Maven gates."
          fi

      - name: Setup Java
        if: steps.changes.outputs.java_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: axiqra-project/axiqra-code/**/pom.xml

      - name: Validate Maven project
        if: steps.changes.outputs.java_changed == 'true'
        run: mvn -B -ntp -f axiqra-project/axiqra-code/pom.xml validate

      - name: Run unit tests
        if: steps.changes.outputs.java_changed == 'true'
        run: mvn -B -ntp -f axiqra-project/axiqra-code/pom.xml test

  infra-gates:
    name: Infra Config Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          else
            changed_files=$(git ls-files)
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^axiqra-project/axiqra-infra/|^\.github/workflows/'; then
            echo "infra_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra_changed=false" >> "$GITHUB_OUTPUT"
            echo "No infra changes detected; skipping infra gates."
          fi

      - name: Validate Docker Compose config
        if: steps.changes.outputs.infra_changed == 'true'
        working-directory: axiqra-project/axiqra-infra
        run: docker compose --env-file .env.example config --quiet

      - name: Validate XML syntax
        if: steps.changes.outputs.infra_changed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path("axiqra-project").rglob("*.xml"):
              ET.parse(path)
              print(f"valid xml: {path}")
          PY

      - name: Validate SQL files are non-empty
        if: steps.changes.outputs.infra_changed == 'true'
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::SQL file is empty"
              exit 1
            fi
            echo "checked sql: $file"
          done < <(find axiqra-project/axiqra-infra -name '*.sql' -print0)

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          scanners: vuln,misconfig
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          formatter: json
        continue-on-error: true

  ai-review-summary:
    name: AI Review Summary
    runs-on: ubuntu-latest
    needs: [java-gates, infra-gates, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Axiqra Quality Gates Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java Build & Tests: ${{ needs.java-gates.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Infra Config Checks: ${{ needs.infra-gates.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### AI Reviewers" >> "$GITHUB_STEP_SUMMARY"
          echo "- CodeRabbit: requires CodeRabbit App installation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gemini: requires GEMINI_API_KEY secret" >> "$GITHUB_STEP_SUMMARY"
          echo "- Codex: requires OPENAI_API_KEY and API_BASE_URL secrets" >> "$GITHUB_STEP_SUMMARY"
          echo "- OpenRouter: requires OPENROUTER_API_KEY secret" >> "$GITHUB_STEP_SUMMARY"
          echo "- Agnes: requires AGNES_API_KEY and AGNES_API_BASE_URL secrets" >> "$GITHUB_STEP_SUMMARY"
