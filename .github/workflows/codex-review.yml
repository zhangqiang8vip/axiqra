name: Codex AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "docs/**"
      - "axiqra-project/**"
      - "tests/**"
      - ".github/workflows/*.yml"
      - ".github/scripts/**"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to review"
        required: false
        type: string

jobs:
  codex-review:
    name: Codex AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr diff $PR_NUMBER > pr_changes.diff
            echo "diff_size=$(wc -l < pr_changes.diff)" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: env.OPENAI_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install OpenAI SDK
        if: env.OPENAI_API_KEY != ''
        run: npm install openai

      - name: Run Codex Review
        id: review
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ steps.diff.outputs.pr_number }}
        run: |
          node .github/scripts/codex-review.mjs
        env:
          PR_DIFF: ${{ steps.diff.outputs.diff_size }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = `${{ steps.review.outputs.review_body }}`;
            const prNumber = context.payload.pull_request?.number || context.inputs.pr_number;

            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## Codex AI Code Review 🔮\n\n${reviewBody}\n\n---\n*Reviewed by Codex AI*`
              });
            }
