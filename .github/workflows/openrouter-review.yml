name: OpenRouter AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/.gitignore"
      - "docs/**"
      - "tests/**"
      - "axiqra-project/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "**/*.mjs"
      - "**/*.js"
      - "**/*.py"
      - "**/*.java"
      - "**/*.xml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sql"
      - "**/Dockerfile*"

jobs:
  openrouter-review:
    name: OpenRouter AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          write_output() {
            delimiter="ghadelimiter_$(openssl rand -hex 16)"
            {
              echo "$1<<$delimiter"
              printf '%s\n' "$2"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          pr_data=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '{title: .title, base: .base.ref, author: .user.login}')
          write_output "title" "$(printf '%s' "$pr_data" | jq -r '.title')"
          write_output "base" "$(printf '%s' "$pr_data" | jq -r '.base')"
          write_output "author" "$(printf '%s' "$pr_data" | jq -r '.author')"

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          gh pr diff "$PR_NUMBER" > pr_changes.diff
          echo "diff_size=$(wc -l < pr_changes.diff)" >> "$GITHUB_OUTPUT"

      - name: OpenRouter Code Review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          PR_AUTHOR: ${{ steps.pr_info.outputs.author }}
          PR_BASE: ${{ steps.pr_info.outputs.base }}
          DIFF_SIZE: ${{ steps.diff.outputs.diff_size }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY secret not set. Skipping OpenRouter review."
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_INFO="PR #$PR_NUMBER - $PR_TITLE"

          # Read diff content, validated as UTF-8, truncated to 120000 chars
          DIFF_CONTENT=$(head -c 120000 pr_changes.diff 2>/dev/null | iconv -f utf-8 -t utf-8 -c 2>/dev/null | cut -c1-120000)
          if [ -z "$DIFF_CONTENT" ]; then
            DIFF_CONTENT=$(head -c 120000 pr_changes.diff 2>/dev/null || echo "[no diff]")
          fi

          USER_CONTENT=$(printf '%s\n' \
            "Review the following PR changes." \
            "" \
            "PR: $PR_INFO" \
            "Author: $PR_AUTHOR" \
            "Base branch: $PR_BASE" \
            "Diff size: $DIFF_SIZE lines" \
            "" \
            "## Review Focus" \
            "1. Security: hardcoded secrets, API key leaks, injection risks" \
            "2. MCP protocol compliance: quota limits, error handling" \
            "3. Error handling: async try/catch, proper HTTP status codes" \
            "4. Test coverage: new code has corresponding tests" \
            "5. Code quality: ESM imports, naming, error context" \
            "6. Workflow changes: trigger paths, permissions, secrets usage" \
            "" \
            "## Output Format" \
            "## Summary" \
            "[One paragraph overview]" \
            "" \
            "## Critical Issues (must fix)" \
            "- [file:line] - issue description" \
            "" \
            "## Suggestions (recommended)" \
            "- [file:line] - suggestion description" \
            "" \
            "## Positive Highlights" \
            "- What was done well" \
            "" \
            "---" \
            '```diff' \
            "$DIFF_CONTENT" \
            '```')

          PAYLOAD=$(jq -n \
            --arg model "openrouter/free" \
            --argjson max_tokens 2048 \
            --arg system "You are an expert code reviewer for the Axiqra project (a knowledge engineering and memory system). Provide concise, actionable feedback." \
            --arg user "$USER_CONTENT" \
            '{
              model: $model,
              max_tokens: $max_tokens,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }')

          if ! RESPONSE=$(curl --fail-with-body --show-error --silent --max-time 60 -X POST \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/zhangqiang8vipp/axiqra" \
            -H "X-Title: Axiqra Code Review" \
            -d "$PAYLOAD"); then
            echo "::warning::OpenRouter API request failed."
            exit 0
          fi

          REVIEW=$(printf '%s' "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)

          if [ -n "$REVIEW" ]; then
            delimiter="ghadelimiter_$(openssl rand -hex 16)"
            {
              echo "review_body<<$delimiter"
              printf '%s\n' "$REVIEW"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            ERROR_MSG=$(printf '%s' "$RESPONSE" | jq -r '.error.message // "unknown error"' 2>/dev/null || echo "unknown error")
            echo "::warning::OpenRouter API error: $ERROR_MSG"
          fi

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = process.env.REVIEW_BODY;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## OpenRouter AI Code Review 🤖\n\n${reviewBody}\n\n---\n*Reviewed by OpenRouter (openrouter/free model)*`
              });
            }
