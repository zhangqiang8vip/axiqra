name: Gemini AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/*.yml"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"

jobs:
  gemini-review:
    name: Gemini AI Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_TITLE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.title')
          PR_AUTHOR=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.user.login')
          PR_BASE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.base.ref')

          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "author<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "base<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_BASE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          gh pr diff $PR_NUMBER > pr_changes.diff
          echo "diff_size=$(wc -l < pr_changes.diff)" >> $GITHUB_OUTPUT

      - name: Gemini Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY not set. Skipping."
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_INFO="PR #$PR_NUMBER - ${{ steps.pr_info.outputs.title }}"
          AUTHOR="${{ steps.pr_info.outputs.author }}"
          BASE="${{ steps.pr_info.outputs.base }}"
          DIFF_SIZE="${{ steps.diff.outputs.diff_size }}"

          REVIEW_TEXT=$(jq -n \
            --arg pr_info "$PR_INFO" \
            --arg author "$AUTHOR" \
            --arg base "$BASE" \
            --arg diff_size "$DIFF_SIZE" \
            'You are an expert code reviewer for the Axiqra project (a knowledge engineering and memory system). Review the following PR changes.

PR: \($pr_info)
Author: \($author)
Base branch: \($base)

Review focus areas:
1. Security: hardcoded secrets, API key leaks, injection risks
2. MCP protocol compliance: quota limits, error handling
3. Error handling: async try/catch, proper HTTP status codes
4. Test coverage: new code has corresponding tests
5. Code quality: ESM imports, naming, error context

Provide your review in this format:
## Summary
[One paragraph overview]

## Critical Issues (must fix)
- [file:line] - issue description

## Suggestions (recommended)
- [file:line] - suggestion description

## Positive Highlights
- What was done well

Diff size: \($diff_size) lines
Output format: Markdown')

          PAYLOAD=$(jq -n \
            --arg text "$REVIEW_TEXT" \
            '{contents: [{parts: [{text: $text}]}]}')

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          REVIEW=$(echo $RESPONSE | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -n "$REVIEW" ]; then
            echo "review_body<<EOF" >> $GITHUB_OUTPUT
            echo "$REVIEW" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = process.env.REVIEW_BODY;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## Gemini AI Code Review\n\n${reviewBody}\n\n---\n*Reviewed by Gemini AI*`
              });
            }
