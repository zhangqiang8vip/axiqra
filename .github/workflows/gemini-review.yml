name: Gemini AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "**/.gitignore"
      - "docs/**"
      - "tests/**"
      - "axiqra-project/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "**/*.mjs"
      - "**/*.js"
      - "**/*.py"
      - "**/*.java"
      - "**/*.xml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sql"
      - "**/Dockerfile*"

jobs:
  gemini-review:
    name: Gemini AI Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          write_output() {
            delimiter="ghadelimiter_$(openssl rand -hex 16)"
            {
              echo "$1<<$delimiter"
              printf '%s\n' "$2"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title')
          PR_AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')
          PR_BASE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')

          write_output "title" "$PR_TITLE"
          write_output "author" "$PR_AUTHOR"
          write_output "base" "$PR_BASE"

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          gh pr diff "$PR_NUMBER" > pr_changes.diff
          echo "diff_size=$(wc -l < pr_changes.diff)" >> "$GITHUB_OUTPUT"

      - name: Gemini Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          PR_AUTHOR: ${{ steps.pr_info.outputs.author }}
          PR_BASE: ${{ steps.pr_info.outputs.base }}
          DIFF_SIZE: ${{ steps.diff.outputs.diff_size }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY not set. Skipping."
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context, skipping."
            exit 0
          fi

          PR_INFO="PR #$PR_NUMBER - $PR_TITLE"
          DIFF_CONTENT=$(head -c 80000 pr_changes.diff 2>/dev/null || echo "[no diff]")

          REVIEW_TEXT=$(printf '%s\n' \
            "You are an expert code reviewer for the Axiqra project (a knowledge engineering and memory system). Review the following PR changes." \
            "" \
            "PR: $PR_INFO" \
            "Author: $PR_AUTHOR" \
            "Base branch: $PR_BASE" \
            "" \
            "Review focus areas:" \
            "1. Security: hardcoded secrets, API key leaks, injection risks" \
            "2. MCP protocol compliance: quota limits, error handling" \
            "3. Error handling: async try/catch, proper HTTP status codes" \
            "4. Test coverage: new code has corresponding tests" \
            "5. Code quality: ESM imports, naming, error context" \
            "" \
            "Provide your review in this format:" \
            "## Summary" \
            "[One paragraph overview]" \
            "" \
            "## Critical Issues (must fix)" \
            "- [file:line] - issue description" \
            "" \
            "## Suggestions (recommended)" \
            "- [file:line] - suggestion description" \
            "" \
            "## Positive Highlights" \
            "- What was done well" \
            "" \
            "Diff size: $DIFF_SIZE lines" \
            "Output format: Markdown" \
            "" \
            '```diff' \
            "$DIFF_CONTENT" \
            '```')

          PAYLOAD=$(jq -n \
            --arg text "$REVIEW_TEXT" \
            '{contents: [{parts: [{text: $text}]}]}')

          if ! RESPONSE=$(curl --fail-with-body --show-error --silent --max-time 60 -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"); then
            echo "::warning::Gemini API request failed."
            exit 0
          fi

          REVIEW=$(printf '%s' "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || true)

          if [ -n "$REVIEW" ]; then
            delimiter="ghadelimiter_$(openssl rand -hex 16)"
            {
              echo "review_body<<$delimiter"
              printf '%s\n' "$REVIEW"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            ERROR_MSG=$(printf '%s' "$RESPONSE" | jq -r '.error.message // "unknown error"' 2>/dev/null || echo "unknown error")
            echo "::warning::Gemini API call returned no review content: $ERROR_MSG"
            exit 0
          fi

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = process.env.REVIEW_BODY;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## Gemini AI Code Review\n\n${reviewBody}\n\n---\n*Reviewed by Gemini AI*`
              });
            }
